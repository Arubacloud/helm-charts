name: Release Helm Charts

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Package all charts
        run: |
          mkdir -p packaged
          for dir in charts/*/; do
            chart_name=$(basename "$dir")
            echo "Packaging $chart_name"
            helm package "$dir" -d packaged --dependency-update || {
              echo "Warning: Failed to package $chart_name with dependencies, trying without..."
              helm package "$dir" -d packaged
            }
          done

      - name: Generate chart list for release notes
        id: chart_list
        run: |
          notes="## Charts included in this release\n\n"
          for dir in charts/*/; do
            chart_name=$(basename "$dir")
            version=$(grep '^version:' "$dir/Chart.yaml" | awk '{print $2}')
            notes+="- **$chart_name** \`$version\`\n"
          done
          echo -e "$notes" > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaged/*.tgz
          body_path: release_notes.md
          generate_release_notes: true
